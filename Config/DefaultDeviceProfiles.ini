; Perfis de dispositivo — derivados de docs/performance/orcamento-mobile.md.
;
; POR QUÊ este arquivo existe (DP-mobile-03): sem um perfil mobile declarado, a
; engine herda configuração pensada para PC, e isso só aparece no primeiro build
; num aparelho — tarde, e atrás de B-006/B-007, o que torna "tarde" mais caro.
;
; LIMITE HONESTO: nada aqui foi verificado. Não há como verificar nesta máquina;
; a validação está em docs/verification/mobile.md, marcada BLOQUEADA.

[/Script/Engine.DeviceProfileManager]
+DeviceProfileNameAndTypes=Mobile,Mobile

[Mobile DeviceProfile]
; Orçamento: até 1280x720 com escala dinâmica. Renderizar na resolução nativa
; de tela de celular gasta em pixels indistinguíveis à distância de uso.
+CVars=r.MobileContentScaleFactor=0
+CVars=r.ScreenPercentage=80
+CVars=r.DynamicRes.OperationMode=1
+CVars=r.DynamicRes.MinScreenPercentage=60
+CVars=r.DynamicRes.MaxScreenPercentage=100

; Orçamento: 33,3 ms (30 FPS). 60 FPS em mundo aberto num aparelho de gama média
; de 4 anos é promessa que não se cumpre; o alvo de 60 segue valendo em PC.
+CVars=t.MaxFPS=30
+CVars=r.DynamicRes.FrameTimeBudget=33.3

; Orçamento: 384 MB de streaming. O raio de World Partition e o pool de
; texturas são os dois maiores consumidores, e é aqui que eles se declaram.
+CVars=r.Streaming.PoolSize=192
+CVars=r.Streaming.MaxEffectiveScreenSize=1280

; Custo por frame: sombra dinâmica e pós-processamento pesado são o primeiro
; corte num aparelho desta classe.
+CVars=r.Shadow.CSM.MaxCascades=1
+CVars=r.MobileMSAA=1
+CVars=r.DefaultFeature.MotionBlur=0
+CVars=r.DefaultFeature.Bloom=0
+CVars=r.DefaultFeature.AmbientOcclusion=0
