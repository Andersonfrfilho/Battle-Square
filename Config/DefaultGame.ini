[/Script/BattleSquare.BattleSquareGameMode]
; Encontros que povoam o mundo e ANDAM. Zero desliga.
WorldEncounterCount=6
; Cenário do mundo. A casa da grade é o passo com que a mata se planta.
WorldSceneryCellSizeUnits=200.0
; Raio da ILHA. Vinte mil, e não seis mil, para caber os cinco setores de bioma
; — deserto, glaciar e vulcão precisam ficar LONGE da mata de casa, senão
; atravessar de um para o outro é meia dúzia de passos e não uma viagem.
; A ilha inteira não é montada de uma vez: `RegionResidency` mantém vivos só os
; nove pedaços à volta de quem anda.
; 1,4 km de raio: 6 km2 de terra, 2,8 km de travessia, ~12 min a pe.
; Escolhido para 100 jogadores a 60.000 m2 cada — entre Rust cheio (40.000)
; e Rust medio (107.000). Cidade cheia, mato seu.
WorldIslandRadiusUnits=140000.0
WorldCoastShape=ComEncaixe

; Semente da mata, SEPARADA da do povoamento: mudar onde os inimigos nascem
; nao deve replantar a floresta inteira.
WorldScenerySeed=20260829
; Painel do mundo (seu pet, atributos, quem esta perto). Zero desliga.
WorldStatusRefreshSeconds=0.5
; Campos de treino: cinco clareiras em circulo, uma por atributo.
bSpawnTrainingFields=True
TrainingFieldRingRadiusUnits=22000.0
WorldEncounterSpawnRadiusUnits=4000.0
WorldEncounterSeed=20260827
