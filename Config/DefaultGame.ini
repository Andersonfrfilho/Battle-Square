[/Script/BattleSquare.BattleSquareGameMode]
; Encontros que povoam o mundo e ANDAM. Zero desliga.
WorldEncounterCount=6
; Cenário do mundo. O raio do chão é 30x a casa — 200 dá 6000, o bastante para
; cobrir os 4000 em que os encontros nascem, com margem para andar além deles.
WorldSceneryCellSizeUnits=200.0
; Semente da mata, SEPARADA da do povoamento: mudar onde os inimigos nascem
; nao deve replantar a floresta inteira.
WorldScenerySeed=20260829
; Painel do mundo (seu pet, atributos, quem esta perto). Zero desliga.
WorldStatusRefreshSeconds=0.5
; Campos de treino: cinco clareiras em circulo, uma por atributo.
bSpawnTrainingFields=True
TrainingFieldRingRadiusUnits=1800.0
WorldEncounterSpawnRadiusUnits=4000.0
WorldEncounterSeed=20260827
+WorldEncounterCatalogIds=61ab4f04-8b16-4fb1-8588-e572a2aac188
; Mesma tela de acoes da tela de batalha: uma tela, nao duas.
BattleActionSelectorWidgetClassPath=/Game/UI/WBP_BattleActionSelector.WBP_BattleActionSelector_C
; Encontros no mundo aberto (M5). Aponta para o espelho de FIXTURE de propósito:
; WorldStreamingTest é nível de verificação, e o espelho de produção só existe
; depois que o worker de sync roda contra a API. Trocar estes valores é o que
; liga o mesmo mecanismo a dados reais.
; Relativo AO PROJETO — o código resolve. Um caminho absoluto ou relativo ao
; binário só funcionaria num layout (editor OU pacote), nunca nos dois.
WorldEncounterMirrorPath=Saved/PetMirrorFixture/pets-mirror.sqlite
WorldEncounterMirrorKeyHex=ad2f50e7781fcca5148299d249825f117ff78cc0b1758de30ce9832f01918e39
WorldEncounterMirrorPublicKeyPem="-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEASmCzzcPySYHgKJgbH2uuAjtP4gXGRl2jP4ynBxOF2K0=\n-----END PUBLIC KEY-----\n"
; UnrealTestFixturePet — o único do fixture que os testes tratam como estável
; (os "Fluffy" são mutados por verificação manual).
WorldEncounterPlayerCatalogId=61ab4f04-8b16-4fb1-8588-e572a2aac188
; Pawn que o jogador controla. Spawnar o certo não depende de streaming — e é
; ele quem PUXA o streaming. Blueprint, não classe C++ direta, porque os assets
; de Enhanced Input vivem fora do C++ (DP-trav-06).
WorldExplorerPawnClassPath=/Game/Blueprints/BP_WorldExplorer.BP_WorldExplorer_C

[/Script/BattleSquare.BattleScreenGameMode]
; true = a batalha comeca com VOCE escolhendo pelos dois lados (primeiro pelo
; seu pet, depois pelo do oponente). Ferramenta de desenvolvimento; nao depende
; de tecla nem de console.
bStartControllingBothSides=False
; Tela de batalha (DP-ui-04): abre uma partida direto, sem mundo aberto.
; Ids vazios = primeiro pet do espelho e o primeiro DIFERENTE dele.
