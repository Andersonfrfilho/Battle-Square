[/Script/BattleSquare.BattleArena]
; Tamanho do campo. Nao precisa ser quadrado: 3x2 e 4x6 sao validos.
; Teto de 15 por eixo — o trace empacota coluna e linha em 4 bits cada.
; O pet do jogador comeca na PRIMEIRA coluna da linha do meio; o oponente,
; na ultima. Layout de Arenas.json so e aplicado se tiver este tamanho.
GridColumns=3
GridRows=3

; O clima do cenário. Ele decide a linha da neve da serra do horizonte:
; a temperatura ao pé da montanha perde 6,5 °C por quilômetro de subida, e
; onde ela cruza o zero começa o gelo.
;
;   Temperate  mata (padrão) — neve acima de ~2460 m: só os picos maiores
;   Cold       serra fria    — neve acima de ~460 m: quase tudo congela
;   Mild       clima bom     — nenhum pico desta serra alcança o congelamento
;   Desert     deserto       — idem, e por margem ainda maior
[/Script/BattleSquare.MountainRange]
Climate=Temperate

[/Script/BattleSquare.Backpack]
; Quantos itens cada pet pode VESTIR ao mesmo tempo.
;
; Configuração, e não constante no código, pela mesma razão que o tamanho da
; grade é: um número cravado mente na primeira vez que alguém quiser um pet com
; mais espaço, e mente em silêncio.
;
; Quatro não é escolhido no vazio: com um só, a biologia decidiria tudo e o item
; viraria enfeite; com muitos, somar equipamentos anularia um fluido inteiro e a
; escolha de biologia perderia sentido.
SlotsPerPet=4

[/Script/BattleSquare.ForestBackdrop]
; MV2 — a árvore cresce com a idade do MUNDO. Números de balanceamento, não
; literais no C++ (invariante 2): dias até o tamanho adulto, e o tamanho de
; uma muda recém-nascida como fração do adulto.
GrowthDaysToMaturity=30
GrowthSaplingScale=0.35

[/Script/BattleSquare.WorldAge]
; MV3/MV4 — prazo de rebrota de uma árvore cortada, em DIAS de idade do mundo
; (a idade do mundo é contada em dias, MV1). Número de config, nunca literal no
; C++: mudar aqui muda o tempo de rebrota sem recompilar.
TreeRegrowthDeadlineDays=7

[/Script/BattleSquare.PetAging]
; MV6 — o pet envelhece (decisões 32/33/34). Números de balanceamento, não
; literais no C++: tempo de vida natural em dias de mundo, e quantos dias de
; vida cada ato de cuidado (conviver, dar atenção) desconta do envelhecimento.
LifespanDays=120
CareDaysPerAct=2.0

[/Script/BattleSquare.WorldEvents]
; MB4 — acima desta magnitude de desastre (0..1), um assentamento fica
; abandonado e para de oferecer serviços. Número de config, nunca literal.
SettlementAbandonMagnitude=0.7

[/Script/BattleSquare.SettlementEconomy]
; MN5 — precos de assentamento como numero de config: mudar aqui muda o preco
; sem recompilar. Sao as torneiras que Mae Natureza gira (NatureBalance).
PrecoBase=100
AgioDaCidade=160
CidadePagaPeloPet=70
CuraNaCidade=25
RendaDoLiderPorCentoDia=30
PremioDaVila=30

[/Script/BattleSquare.NatureCensus]
; MN6 — a faixa-alvo saudavel do censo de uma especie, por ELEMENTOS DO MAPA
; (decisao 53: nao por ilha nem por regiao administrativa). Abaixo do minimo,
; Mae Natureza migra a especie para dentro (peso de encontro sobe); acima do
; maximo, para fora. Numero de config, afinavel sem recompilar.
SpeciesTargetMin=3
SpeciesTargetMax=20

[/Script/BattleSquare.WorldFinding]
; decisao 57 — o achado: dinheiro achado no mundo (ruina, clareira fechada,
; mercado-negro). Faixa do valor por lugar, deterministica pela semente do lugar.
; Numeros de config, afinaveis sem recompilar.
FindingMinAmount=10
FindingMaxAmount=60

[/Script/BattleSquare.Art]
; ADOCAO DE PACOTE DE ARTE (PRONTOS.md §5, AR5 04/09/2026). Papel sem chave cai
; na primitiva — nunca fica invisivel (invariante 20). Os sete papeis abaixo
; apontam para os assets AUTORADOS que ja existem em Content/Environment/Nature/
; (os 6 do inventario original, que ForestBackdrop ja usa via SpeciesAssetPath) —
; MESMA familia visual, sem importar nada novo, sem risco. Isto eleva ~20 atores
; (MountainRange, WalkableMountain, CaveSystem, Volcano, Village, GroundUseActor,
; FerryActor, WorldEncounterActor, WorldExplorerCharacter, VillagerActor,
; MountView, PetView, PetOwnerView, BattleArena, TrailMesh, AqueductMesh,
; RiverMesh, TerrainMesh, CrossingMesh) de primitiva (cubo/cilindro/esfera) para
; malha de verdade, so trocando dado.
Mesh_ForestTree=/Game/Environment/Nature/tree_oak.tree_oak
Mesh_CanopyTree=/Game/Environment/Nature/tree_pineTallA_detailed.tree_pineTallA_detailed
Mesh_Rock=/Game/Environment/Nature/rock_tallA.rock_tallA
Mesh_DeadWood=/Game/Environment/Nature/log.log
Mesh_Undergrowth=/Game/Environment/Nature/plant_bush.plant_bush
Mesh_Accent=/Game/Environment/Nature/flower_redA.flower_redA
