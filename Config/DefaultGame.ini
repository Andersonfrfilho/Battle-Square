[/Script/BattleSquare.BattleArena]
; Tamanho do campo. Nao precisa ser quadrado: 3x2 e 4x6 sao validos.
; Teto de 15 por eixo — o trace empacota coluna e linha em 4 bits cada.
; O pet do jogador comeca na PRIMEIRA coluna da linha do meio; o oponente,
; na ultima. Layout de Arenas.json so e aplicado se tiver este tamanho.
GridColumns=3
GridRows=3

; O clima do cenário. Ele decide a linha da neve da serra do horizonte:
; a temperatura ao pé da montanha perde 6,5 °C por quilômetro de subida, e
; onde ela cruza o zero começa o gelo.
;
;   Temperate  mata (padrão) — neve acima de ~2460 m: só os picos maiores
;   Cold       serra fria    — neve acima de ~460 m: quase tudo congela
;   Mild       clima bom     — nenhum pico desta serra alcança o congelamento
;   Desert     deserto       — idem, e por margem ainda maior
[/Script/BattleSquare.MountainRange]
Climate=Temperate
