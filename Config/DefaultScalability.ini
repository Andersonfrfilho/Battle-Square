; Escalabilidade — derivada de docs/performance/orcamento-mobile.md.
; Ver o cabeçalho de DefaultDeviceProfiles.ini: nada aqui foi verificado, e a
; validação está em docs/verification/mobile.md, marcada BLOQUEADA.
;
; O nível 0 é o que o aparelho de referência (gama média de ~4 anos, 4 GB de
; RAM) deve usar. Os níveis acima existem para aparelhos melhores; abaixo do 0
; não há alvo declarado, porque não há público declarado.

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.6

[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.MaxResolution=512
r.Shadow.DistanceScale=0.5

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0

[TextureQuality@0]
; Coerente com r.Streaming.PoolSize=192 do perfil Mobile.
r.Streaming.MipBias=1
r.Streaming.PoolSize=192

[EffectsQuality@0]
r.TranslucencyLightingVolumeDim=24
r.RefractionQuality=0
r.SceneColorFringeQuality=0

[FoliageQuality@0]
foliage.DensityScale=0.5
grass.DensityScale=0.5
