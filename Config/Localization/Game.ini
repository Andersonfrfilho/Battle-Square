; Alvo de localização do jogo.
;
; pt-BR é a cultura NATIVA: o texto nasce em português no código, e é dele que
; a tradução parte. Declarar en como nativa obrigaria a traduzir para entrar,
; e o texto certo já está escrito.
;
; Coletar com: UnrealEditor-Cmd BattleSquare.uproject -run=GatherText
;   -config="Config/Localization/Game.ini"

[CommonSettings]
SourcePath=./Content/Localization/Game
DestinationPath=./Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=pt-BR
CulturesToGenerate=pt-BR
CulturesToGenerate=en
CulturesToGenerate=es

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=./Source
ExcludePathFilters=Source/*/Private/Tests/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=./Content/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep5]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationResource
; Sem ResourceName o passo falha e o .locres nunca nasce — e é o .locres que o
; jogo carrega em tempo de execução. Sem ele, traduzir não muda nada na tela.
ResourceName=Game.locres
